name: CI

# What CI checks: formatting, clippy, the canister's unit tests (including "the Candid file matches the code"), that
# the canister builds; the frontend's audit, type check, unit tests and production build, and that the bundle holds
# no development-only code.
#
# What it does not run — run these locally before a release (README, "Tests"):
# - the PocketIC integration tests (make test-canister): they need the PocketIC server that ships with dfx;
# - the browser tests (make e2e, make e2e-local): they need Playwright's browsers, and e2e-local a dfx replica;
# - the security headers check (e2e/headers.mjs): it needs a deployed asset canister;
# - that the generated Candid bindings match the Candid file (part of make check): it runs `dfx generate`, and dfx is
#   not installed here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canister:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain, the wasm32 target, rustfmt and clippy.
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p eliza_backend -p mock_llm --all-targets --features test-hooks -- -D warnings
      # Unit tests, including "the Candid file matches the code" and "0.6.0 clients still understand the interface".
      - run: cargo test --locked -p eliza_backend --lib
      - run: cargo build --locked --target wasm32-unknown-unknown --release -p eliza_backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/eliza_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/eliza_frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # Development-only code must not reach a production bundle. Fails closed: no bundle, or a search that cannot
      # read it, fails too (the same check as `make build`).
      - run: ../../scripts/check-bundle.sh dist
